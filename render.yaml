services:
  - type: web
    name: alma-server
    env: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port 8000"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ALMA_CLIENT_SECRET_JSON
        sync: false
      - key: ALMA_TOKEN_JSON
        sync: false
