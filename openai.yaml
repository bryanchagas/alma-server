schema_version: 1

name_for_human: "Alma – Sistema Inteligente de Análise e Rotina"
name_for_model: "alma_system"

description_for_human: >
  A Alma é um sistema inteligente de análise comportamental e saúde integral.
  Ela combina dados objetivos — como rotina, biometria, performance física,
  sono, nutrição e ritmo corporal — com uma compreensão profunda das dimensões
  emocional, neurológica e espiritual da vida. A Alma identifica padrões,
  mede progresso e organiza a rotina de forma equilibrada, coerente e intencional.

description_for_model: >
  API que permite acessar eventos, criar compromissos e analisar a rotina de Bryan
  usando o Google Calendar como fonte principal. Suporta listagem de eventos futuros,
  janelas de tempo livre, criação e remoção de eventos.

